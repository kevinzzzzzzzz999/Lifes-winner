name: Verify reviewed source privacy

# Current desktop source is maintained directly in Git. This manual check never
# expands historical archives into the checkout or commits back to main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check reviewed publication files
        run: python3 scripts/check-publication.py
